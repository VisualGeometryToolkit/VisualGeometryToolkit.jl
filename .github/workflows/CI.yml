# PRs and pushes to main: the affected packages and their dependents, Linux,
# Julia 1.12 (DESIGN D14). GPU items record a skip on hosted runners.
name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  id-token: write   # Codecov upload by OIDC, no token secret
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.12' }
      - id: affected
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            julia --startup-file=no ci/affected.jl "origin/${{ github.base_ref }}" HEAD
          else
            julia --startup-file=no -e 'using TOML; p = filter(!=("ci"), TOML.parsefile("Project.toml")["workspace"]["projects"]); s = "[" * join(("\"$x\"" for x in p), ",") * "]"; println(s); open(io -> println(io, "packages=", s), ENV["GITHUB_OUTPUT"], "a")'
          fi
  test:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.12' }
      - uses: julia-actions/cache@v2
      - name: Instantiate (resolves the workspace; downloads this package's test env only)
        run: julia --project=${{ matrix.package }}/test -e 'using Pkg; Pkg.instantiate()'
      - name: Test
        run: julia --project=${{ matrix.package }} -e 'using Pkg; Pkg.test(; coverage = true)'
      - id: covdirs   # src/ and ext/ where present (not every package has ext/)
        run: |
          d=${{ matrix.package }}/src
          [ -d ${{ matrix.package }}/ext ] && d="$d,${{ matrix.package }}/ext"
          echo "dirs=$d" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{ steps.covdirs.outputs.dirs }}
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ matrix.package }}
          use_oidc: true
          fail_ci_if_error: false
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: '1.12' }
      - uses: julia-actions/cache@v2
      - run: julia --project=ci -e 'using Pkg; Pkg.instantiate()'
      - name: Registration rules (versions, compat, names, licenses, allow-list, no tracked Manifest)
        run: julia --project=ci ci/registration_lint.jl
      - name: Agent docs policy (public patterns)
        run: julia --project=ci ci/agent_docs.jl
