# PRs and pushes to main: the affected packages and their dependents, Linux,
# Julia 1.13 (DESIGN D14; the whole stack requires 1.13). GPU items record a skip on hosted runners.
# The jobs are the stack's (StackCI.yml: plan, one test job per package, lint),
# the same every stack repository calls.
name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  id-token: write   # Codecov upload by OIDC, no token secret
jobs:
  ci:
    uses: ./.github/workflows/StackCI.yml
    with:
      # every stack package has a first registration in General merged or filed
      registration-lint-args: '--subsequent'
