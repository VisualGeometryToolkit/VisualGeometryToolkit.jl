# One CompatHelper stream for the whole workspace: every package and its test
# and docs environments (StackCompatHelper.yml, the same every stack repository calls).
name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    uses: ./.github/workflows/StackCompatHelper.yml
    secrets:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
