# One CompatHelper stream for the whole workspace: every package and its test
# and docs environments.
name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with: { version: '1' }
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: |
          julia -e '
            using CompatHelper
            pkgs = ["VisualGeometryToolkitCore", "VisualGeometryToolkitIO", "VisualGeometryToolkitFeatures", "VisualGeometryToolkitEstimation", "VisualGeometryToolkitEval", "PoseLib"]
            subdirs = vcat([[p, "$p/test", "$p/docs"] for p in pkgs]..., ["ci"])
            CompatHelper.main(; subdirs)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
