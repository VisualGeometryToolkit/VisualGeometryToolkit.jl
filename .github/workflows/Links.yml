# Dead-link check (lychee) over the tracked READMEs, CITATION.cff and every
# package's docs/src Markdown (StackLinks.yml, the same every stack repository
# calls: the stack's settings and exclusions are there, this repository's
# exclusions below). Runs on PRs, pushes to main, weekly (links rot without a
# commit), and by hand.
name: Links
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  lychee:
    uses: ./.github/workflows/StackLinks.yml
    with:
      paths: >-
        README.md CITATION.cff '*/README.md' '*/*/README.md'
        '*/docs/src/**/*.md'
      # 1. Per-package release docs exist only once a package is tagged, after its
      #    General registration (TagBot then deploys /<Package>/stable/). Expected 404s
      #    until then: remove this exclusion once every package has a tagged release.
      # 2. VisualGeometryToolkitCore's Conventions page is generated by docs/make.jl
      #    from conventions/ and ignored by git, so the Markdown sources link to a
      #    file that exists only during a docs build.
      # 3. The CI status badge (GitHub renders it; anonymous fetches can be slow or 404
      #    before the first run on a branch).
      exclude: |
        ^https://visualgeometrytoolkit\.github\.io/VisualGeometryToolkit[A-Za-z]+/stable
        /VisualGeometryToolkitCore/docs/src/guide/conventions\.md$
        ^https://github\.com/VisualGeometryToolkit/[^/]+/actions/workflows/[^/]+/badge\.svg
