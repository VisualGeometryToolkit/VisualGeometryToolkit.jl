# One TagBot per package subdirectory: tags <Package>-v<version>; the ssh key
# lets the tag push trigger Docs.yml (StackTagBot.yml, the same every stack
# repository calls).
name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    uses: ./.github/workflows/StackTagBot.yml
    with:
      packages: '["VisualGeometryToolkitCore","VisualGeometryToolkitIO","VisualGeometryToolkitFeatures","VisualGeometryToolkitEstimation","VisualGeometryToolkitEval","PoseLib"]'
    secrets:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
