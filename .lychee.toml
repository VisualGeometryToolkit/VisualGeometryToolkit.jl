# lychee configuration for the Links workflow (.github/workflows/Links.yml).
# Run locally from the repository root with the same inputs:
#   lychee --config .lychee.toml README.md CITATION.cff '*/README.md' \
#     '*/*/README.md' '*/docs/src/**/*.md'

# Retries and timeouts: patient with slow hosts, polite to all of them.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 16

# 429 is rate limiting, never a dead link. 403 is NOT accepted: no checked file
# links to doi.org or a publisher site (IEEE, ACM, Springer, Elsevier, Wiley),
# which answer 403 to anonymous clients such as CI runners. If such links appear,
# exclude those hosts by name rather than accepting 403 for every host.
accept = ["200..=299", "429"]

# Skip links to localhost and private networks.
exclude_all_private = true

# Mail addresses are not checked.
include_mail = false

# Fragments (#anchors) are not checked (lychee's default): Documenter
# generates heading anchors at build time, so the Markdown sources cannot
# resolve them.

exclude = [
  # Documenter cross references are Markdown links, not URLs:
  # `[x](@ref)`, `[x](@ref Target)`, `[x](@id ...)`, `[x](@extref ...)`,
  # `[x](@cite ...)`, `[x](@citet ...)`, `[x](@citep ...)`.
  '^@(ref|id|extref|cite[tp]?)\b',
  '(^|/)@(ref|id|extref|cite[tp]?)(%20|\b)',
  '^mailto:',
  '^https?://(localhost|127\.0\.0\.1)',
  # Per-package release docs exist only once a package is tagged, after its
  # General registration (TagBot then deploys /<Package>/stable/). Expected 404s
  # until then: remove this exclusion once every package has a tagged release.
  '^https://visualgeometrytoolkit\.github\.io/VisualGeometryToolkit[A-Za-z]+/stable',
  # VisualGeometryToolkitCore's Conventions page is generated by docs/make.jl
  # from conventions/ and ignored by git, so the Markdown sources link to a
  # file that exists only during a docs build.
  '/VisualGeometryToolkitCore/docs/src/guide/conventions\.md$',
  # Codecov badges and app pages 404 for anonymous clients or time out.
  '^https://(app\.)?codecov\.io/',
  # The CI status badge (GitHub renders it; anonymous fetches can be slow or 404
  # before the first run on a branch).
  '^https://github\.com/VisualGeometryToolkit/[^/]+/actions/workflows/[^/]+/badge\.svg',
]

# doi.org rate-limits bursts; one request at a time, spaced out.
[hosts."doi.org"]
concurrency = 1
request_interval = "1s"
