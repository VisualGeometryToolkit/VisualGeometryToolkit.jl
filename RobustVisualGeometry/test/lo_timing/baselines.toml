# LO timing baselines (the gate: VisualGeometryCore test/lo_timing/gate.jl): min µs per call over 7 reps
# on one pinned core, and bytes allocated per call. Re-record with
# LO_TIMING_GATE=record IN THE COMMIT that changes the speed on purpose.
# Re-recorded 2026-10-09 with K+ O3 (the per-call LO states reused, not built): bytes per call
# fall to the convenience entry's result buffers; times within noise of the previous record.
[host]
cpu = "INTEL(R) XEON(R) PLATINUM 8570"
julia = "1.12.6"
core = 56

[arms."GM-IRLS"]
us_per_call = 330.6
bytes_per_call = 6188.0

[arms."Welsch-IRLS"]
us_per_call = 367.1
bytes_per_call = 6188.0
