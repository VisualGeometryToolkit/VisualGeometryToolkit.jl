# The stack's dependency allow-list: one row per project, the stack packages it
# may name in its Project.toml — [deps], [weakdeps], [extras] and the test
# target alike. A "stack package" is any key of this table; a project absent
# from it is an error. Read by `VisualGeometryCore.stack_dependency_violations`
# (the quality gate runs it in every stack package; a paper project's own suite
# calls it with the project's name). It lists the published packages and paper
# projects only: a project kept elsewhere supplies its own row through the
# `extra` keyword (a TOML file in this format), never by adding it here.

VisualGeometryCore = []
VisualGeometryIo = ["VisualGeometryCore"]
VisualGeometryFeatures = ["VisualGeometryCore"]
VisualGeometryEval = ["VisualGeometryCore", "VisualGeometryIo", "RobustVisualGeometry"]
PoseLib = ["VisualGeometryCore"]
# Never RansacScoringDoneRight or LocalOptimizationDoneRight — not even in [extras].
RobustVisualGeometry = ["VisualGeometryCore"]
RansacScoringDoneRight = ["VisualGeometryCore"]
# PoseLib is a weak dependency here.
LocalOptimizationDoneRight = ["VisualGeometryCore", "RobustVisualGeometry", "PoseLib"]
BlobBoards = ["VisualGeometryCore", "VisualGeometryIo", "VisualGeometryFeatures", "RobustVisualGeometry", "RansacScoringDoneRight", "LocalOptimizationDoneRight"]
accv2026 = ["LocalOptimizationDoneRight", "RansacScoringDoneRight", "VisualGeometryEval", "RobustVisualGeometry", "VisualGeometryCore", "VisualGeometryIo", "PoseLib"]
neurips2026 = ["RansacScoringDoneRight", "VisualGeometryEval", "RobustVisualGeometry", "VisualGeometryCore"]
bmvc2026 = ["VisualGeometryCore", "VisualGeometryIo", "VisualGeometryFeatures", "VisualGeometryEval", "RobustVisualGeometry", "RansacScoringDoneRight", "LocalOptimizationDoneRight", "BlobBoards"]
