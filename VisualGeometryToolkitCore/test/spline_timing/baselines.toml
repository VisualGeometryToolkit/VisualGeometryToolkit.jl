# LO timing baselines (the gate: VisualGeometryToolkitCore test/lo_timing/gate.jl): min µs per call over 7 reps
# on one pinned core, and bytes allocated per call. Re-record with
# LO_TIMING_GATE=record IN THE COMMIT that changes the speed on purpose.
[host]
cpu = "13th Gen Intel(R) Core(TM) i9-13900K"
julia = "1.13.3"
core = 1
core_class = "performance"

# OWNER DECISION (2026-11-10, plan 1b's final review): the plan's CPU gate "≤ the old grid" is waived for the
# backprojection — batched +2.8 %, scalar +0.3 % against the old central grid at 004a004c, within the re-measurement
# margin of an efficiency-core baseline; the rounding change that would close it is not worth a golden shift. These
# baselines are the SplineLens's own, and the gate holds the code to them.
[arms."backproject"]
us_per_call = 7.2
bytes_per_call = 0.0

[arms."backproject-batch"]
us_per_call = 204.1
bytes_per_call = 241080.0

[arms."backproject-jacobian"]
us_per_call = 8.2
bytes_per_call = 0.0

[arms."noncentral-project"]
us_per_call = 189.7
bytes_per_call = 0.0

[arms."project-batch"]
us_per_call = 2679.5
bytes_per_call = 171200.0

[arms."project-forward"]
us_per_call = 15.7
bytes_per_call = 0.0

[arms."project-lm"]
us_per_call = 107.3
bytes_per_call = 0.0

[arms."undistort-128"]
us_per_call = 4407.6
bytes_per_call = 145552.0
