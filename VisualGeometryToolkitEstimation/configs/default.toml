# =============================================================================
# Default configuration — the config of record.
#
# `RansacConfig()`, every local-optimization strategy's keyword defaults and
# every `find_*` pipeline's `outlier_halfwidth` and `local_optimization`
# default read THIS file. There is no second set of Julia
# literals to drift from it (src/config_defaults.jl explains the mechanism;
# test/config_toml_tests.jl asserts the file names every key a config struct
# emits, so the completeness cannot rot).
#
# POLICY (matches BlobBoards): this shipped file is not edited per run. Single
# values are overridden by keyword at the call site; a different configuration
# is a different TOML: `RansacConfig(path)` loads its [ransac] table and
# `local_optimization_from_toml` a strategy table, and absent keys inherit this file. The values
# here are baked in at precompile time (`include_dependency` makes an edit
# trigger a recompile), so a Revise session needs a restart to see one.
# =============================================================================

[ransac]
# The three RansacConfig fields. `min_trials` is 100 everywhere now — the
# fitting pipelines used to carry a parallel literal of 500 in _pipeline.jl,
# two "defaults" that disagreed until 2026-09-03.
success_prob   = 0.99
max_trials     = 10000
min_trials     = 100

# -----------------------------------------------------------------------------
# Per-pipeline defaults for the find_* entry points. The local optimization is
# the classical one: least squares on the inliers, `Irls{TLSShape}` with no
# width, so its truncation follows the scorer's decision point (the same
# truncated-quadratic objective in selection and refinement). The paper's
# optimizers (the half-quadratic lifts, GNC, the cross-validated operating
# points) are LocalOptimizationDoneRight's: give one as `local_optimization`.
# -----------------------------------------------------------------------------
[pipelines.homography]
threshold          = 3.0         # px — a convention (OpenCV findHomography's ransacReprojThreshold), not a tuned value
local_optimization = { type = "irls", loss = "tls" }

[pipelines.fundmat]
threshold          = 3.0         # px — a convention (OpenCV findFundamentalMat's ransacReprojThreshold), not a tuned value
local_optimization = { type = "irls", loss = "tls" }

[pipelines.essential]
threshold          = 1.0         # px — a convention (OpenCV findEssentialMat's threshold), not a tuned value
local_optimization = { type = "irls", loss = "tls" }

[pipelines.absolute_pose]
threshold          = 8.0         # px — a convention (OpenCV solvePnPRansac's reprojectionError), not a tuned value
local_optimization = { type = "irls", loss = "tls" }

[pipelines.radial_homography]
threshold          = 3.0         # px — a convention (the homography class's), not a tuned value
local_optimization = { type = "irls", loss = "tls" }

[pipelines.radial_camera]
# The 1-D radial camera of a board (distortion-free verification): the residual
# is the pixel distance to the predicted radial line (codimension 1).
threshold          = 3.0         # px — a convention (the homography class's), not a tuned value
local_optimization = { type = "irls", loss = "tls" }

[pipelines.hand_eye]
# threshold is UNIT-FREE here: a fraction of the problem's characteristic
# length L (median rig translation per motion), so find_hand_eye's default
# MSAC threshold of 0.01·L is the same whether the poses are in metres or
# millimetres (a rotation error of 0.01 rad ≈ 0.57° reaches it). A caller's
# `threshold` keyword is a length (the poses' unit). A convention of this
# package (no external one exists), not a tuned value.
threshold          = 0.01        # × L (dimensionless; rotation enters the residual as L·θ)
motion_pairs       = "consecutive"
local_optimization = { type = "irls", loss = "tls" }

[fit_division_camera]
ncoef             = 1
max_iter          = 30
outlier_halfwidth = 20.0         # px — the uniform outlier half-width, NOT the residual scale

[robot_world_hand_eye]
min_rel_angle_deg = 5.0          # relative motions below this are degenerate for the init

[refine_robot_world_hand_eye]
max_iter = 100                   # the reprojection LM's cap on ACCEPTED iterations (NLLSsolver's count; see [chart_lm])
# The stall postcondition's exact-fit test (VGC `is_stationary`: F < ftol, F the
# squared residual norm), beside [chart_lm]'s stationarity_tol for its gradient
# test. eps (2.220446049250313e-16): NLLSsolver states no cost tolerance of its
# own to share, so only a cost at the rounding floor counts as an exact fit.
ftol = 2.220446049250313e-16

[refine_absolute_pose]
max_iter = 100                   # the bearing pose LM's cap on ACCEPTED iterations (NLLSsolver's count; see [chart_lm])
[fit_rotation]
# The reweighted Kabsch of `fit_rotation`. The loss's width follows the robust
# scale of the residual angles at every iteration (`scale_multiple` × σ̂, the
# shape's efficiency constant at codimension 2 unless a caller gives one).
loss     = "huber"               # a LOSS_TAGS tag
max_iter = 50                    # reweight-and-solve iterations at most
tol      = 1.0e-12               # rad: converged when an iteration moves the rotation by less
[chart_lm]
# The LO refit every chart problem runs (`refine!` → VGC's `lmsolve_chart!`,
# NLLSsolver's Levenberg–Marquardt with Marquardt's DᵀD damping; VGC
# `nlls_options` maps these knobs onto NLLSsolver's options, once): its LM
# iteration cap per refit — NLLSsolver's outer iterations, one ACCEPTED step
# each; an iteration's internal damping loop may reject ~8–10 candidate steps
# before it accepts one (λ grows ×2, ×4, ×8 … until the step falls below
# `dstep`), so the cap bounds accepted steps, not work. The value is
# FastLevenbergMarquardt's documented default (`maxit = 1000`, which counted
# rejected steps too), the driver until 2026-10-27, recorded here rather than
# inherited. The step tolerance is that driver's default `xtol = 1e-10`, not
# restated, and its MEANING CHANGED with the driver: FastLevenbergMarquardt's
# test was relative per component (|pᵢ| < xtol·(xtol + |xᵢ|)), NLLSsolver's
# `dstep` is absolute (max|pᵢ| < 1e-10, chart units) — stricter far from the
# origin, looser near it (a chart LM starts at x = 0).
max_iter = 1000
# The LO refit's relative cost tolerance (NLLSsolver's `reldcost`: stop once a
# step lowers the cost by less than ftol·F; FastLevenbergMarquardt's `ftol`
# until 2026-10-27: an accepted step's actual and predicted reductions both
# below ftol·F). That driver's default was eps, which ran every refit to its
# rounding floor: measured 2026-10-07 on the PhotoTourism E replay (360
# Welsch-IRLS LO calls), 28.6 residual and 8.0 Jacobian sweeps per refit, ~20
# of them rejected steps at the floor. At 1e-10: 5.6 and 4.1, the refit 2.3×
# faster, the returned E within 7.8e-7 (unit Frobenius, max over the 360) of
# the eps run. On NLLSsolver at 1e-10 (measured 2026-10-27 on 317 captured E
# refits of that replay): the same returned chart vector as
# FastLevenbergMarquardt's within 2.0e-7 (max-norm; the median refit's
# ‖x‖∞ is 1.8e-3) and the cost within 2.0e-11 relative, every refit converged. Also the stall postcondition's exact-fit test (its case 1, F < ftol).
ftol = 1.0e-10
# The stall postcondition (VGC `_lm_stationary`): a step-size stop, or one
# without a tolerance (a non-finite trial, the consecutive-failure cap), is
# `:converged` only when the cost is zero by the cost tolerance (F < ftol) or
# max_j |J_jᵀf| / (‖J_j‖‖f‖) ≤ this at the returned point; `:stalled`
# otherwise. Shared by every chart LM — the LO refits, `fit_lens`,
# `refine_ellipse` — and by `refine_robot_world_hand_eye` (VGC
# `nlls_retcode`). Measured 2026-10-01 (the cosine at every step-size stop):
# genuine convergence on noisy data ≤ 6.2e-7 (218 346 LO refits of the LM
# benchmark scenes; the RVG suite's noisy fits ≤ 4e-8); convergence at a
# residual's rounding floor — the noiseless hand-eye fit, whose rotation log
# is accurate to ~√eps — 0.0045–0.037; real stalls — a NaN or discontinuity
# wall in the radial-camera, radial-homography and lens rows (no step along
# −Jᵀf lowers F) — 0.084–0.42, and both FastLevenbergMarquardt issue #4
# reproductions 1.0. The value sits in the gap between the last two.
stationarity_tol = 0.05

[relpose_bundle]
# the relative-pose bundle's LM cap (its `refine!` and `bundle_refine_relpose`) on
# ACCEPTED iterations: NLLSsolver's count, each one possibly hiding ~8–10 rejected
# candidate steps (FastLevenbergMarquardt, until 2026-10-27, counted those too); see [chart_lm]
max_iter = 100
stationarity_tol = 0.05         # its stall postcondition (see [chart_lm]; its own fits measured ≤ 1e-9 at convergence)
# Its relative cost tolerance (NLLSsolver's `reldcost`, as [chart_lm]'s). Set
# 2026-10-27 for FastLevenbergMarquardt, whose default, eps, could not fire
# here: at the cost's rounding floor the actual reduction is rounding noise of
# 1e-15–5e-14 relative (0.5 px residuals of ~600 px coordinates), so every
# candidate step was rejected and the run waited for the step-size test while
# λ climbed back — measured on the A/B scenes (800 px, σ = 0.5 px, N = 100 /
# 1000 / 10000): 21–34 LM iterations at eps, the cost within 1e-6 of its final
# value by iteration 3; at 1e-10 every N stopped in 5 (FLM code 1), the cost
# within 4.2e-14 relative and the pose within 6e-9 chart units of the eps run.
# KEPT on NLLSsolver (2026-10-27), which accepts a step whose cost does not
# rise, so at the floor its iterations are accepted, each a full
# linearization: at NLLSsolver's default (1e-15) and at eps the same scenes
# take 8 / 8 / 7 iterations instead of 5 (60% more linearizations and Schur
# solves), the cost within 2.3e-14 relative and the rotation within 1e-9 of
# the 1e-10 run; at 1e-10 it stops in 5, as the former driver did.
ftol = 1.0e-10

[fit_lens]
# the lens regression's LM cap on ACCEPTED iterations (NLLSsolver's count, each
# possibly hiding ~8–10 rejected candidate steps; see [chart_lm])
max_iter = 100

# The EM of the Student-t + uniform mixture (`MixtureEmConfig`): what an
# iteration does to the model, and to each part of the noise model. Under
# `fit_residual_mixture` the model is a held fit's, so the update is "keep_model";
# its `tol` stops the EM once an iteration lowers the mixture NLL by no more
# than that fraction. Every nuisance part is estimated: ŝ², ν and the inlier
# prior π (a held part is `{ type = "fixed_s2", s2 = … }`,
# `{ type = "fixed_prior", inlier_prior = … }` or `{ type = "fixed_nu", nu = … }`;
# ν may also be "consensus_dof", held at the consensus seed's posterior-
# predictive dof).
[mixture_em]
max_iter = 200
model_update = { type = "keep_model", tol = 1.0e-10 }
nuisance = { scale = "estimated", inlier_prior = "estimated", nu = "estimated" }

# -----------------------------------------------------------------------------
# Local-optimization strategy internals. The keyword defaults of each strategy
# constructor read its table. A strategy's width (`scale_multiple` or
# `loss_width`) is deliberately absent: given none it follows the scorer's
# decision point.
# -----------------------------------------------------------------------------
[local_optimization.irls]
max_iter = 25
