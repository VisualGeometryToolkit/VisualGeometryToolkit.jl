# =============================================================================
# Default configuration — the config of record.
#
# `RansacConfig()`, every local-optimization strategy's keyword defaults and
# every `find_*` pipeline's `scoring` and `local_optimization_strategy` default read
# THIS file. There is no second set of Julia
# literals to drift from it (src/config_defaults.jl explains the mechanism;
# test/config_toml_tests.jl asserts the file names every key a config struct
# emits, so the completeness cannot rot).
#
# POLICY (matches BlobBoards): this shipped file is not edited per run. Single
# values are overridden by keyword at the call site; a different configuration
# is a different TOML: `RansacConfig(path)` loads its [ransac] table and
# `optimization_strategy_from_toml` a strategy table, and absent keys inherit this file. The values
# here are baked in at precompile time (`include_dependency` makes an edit
# trigger a recompile), so a Revise session needs a restart to see one.
# =============================================================================

[ransac]
# The three RansacConfig fields. `min_trials` is 100 everywhere now — the
# fitting pipelines used to carry a parallel literal of 500 in _pipeline.jl,
# two "defaults" that disagreed until 2026-09-03.
success_prob   = 0.99
max_trials     = 10000
min_trials     = 100

# -----------------------------------------------------------------------------
# Per-pipeline defaults for the find_* and refine_* entry points: the scorer
# (`scoring = { type = …, … }`, read by scoring_from_toml for the problem's
# type) and the local optimization (`local_optimization_strategy = { type = …, … }`,
# read by optimization_strategy_from_toml) — the one robust-estimation schema.
# Each scorer takes its OWN width key and the other's is refused: MSAC and
# RANSAC ("msac", "ransac") take `threshold`; the Student-t + uniform marginal
# takes `outlier_halfwidth`, the half-width of its uniform outlier component,
# with its priors inherited from [scoring.student_t_uniform]. Every class's scorer of record is MSAC. The local
# optimization is the classical one: least squares on the inliers,
# `Irls{TLSShape}` with no width, so its truncation follows the scorer's
# decision point (a threshold scorer's threshold; the Student-t scorer's MAP
# crossover at the consensus partition's scale) — the same truncated-quadratic
# objective in selection and refinement. The paper's
# optimizers (the half-quadratic lifts, GNC, the cross-validated operating
# points) are LocalOptimizationDoneRight's: give one as `local_optimization_strategy`.
# -----------------------------------------------------------------------------
[pipelines.homography]
scoring            = { type = "msac", threshold = 3.0 }   # px — a convention (OpenCV findHomography's ransacReprojThreshold), not a tuned value
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.fundmat]
scoring            = { type = "msac", threshold = 3.0 }   # px — a convention (OpenCV findFundamentalMat's ransacReprojThreshold), not a tuned value
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.essential]
scoring            = { type = "msac", threshold = 1.0 }   # px — a convention (OpenCV findEssentialMat's threshold), not a tuned value
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.rotation]
scoring            = { type = "msac", threshold = 1.0 }   # px — the essential problem's convention: both are bearing residuals whitened into pixels
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.circle]
scoring            = { type = "msac", threshold = 1.0 }   # px — the Sampson distance to the circle (≈ the geometric one); a convention of this package for points located to a pixel, not a tuned value
# The robustified LM (Triggs): one NLLSsolver LM under the Welsch loss,
# its width efficiency_constant·ŝ at the hypothesis's Student-t scale (the plain
# multiple, loss_width = efficiency_constant·ŝ), as for Irls{WelschShape}.
# Triggs has NO default multiple. Welsch (owner-decided 2026-10-29, was Cauchy):
# a redescending loss, so far outliers lose all influence — on a fisheye image
# circle's contour the Cauchy fit sat ~0.9 px from the inliers' least squares.
# 2.5: owner-decided (2026-10-29), the stack's operating multiple of a
# consensus-anchored LM width (LocalOptimizationDoneRight's poselib_adapt).
local_optimization_strategy = { type = "triggs", loss = "welsch", efficiency_constant = 2.5 }

[pipelines.ellipse]
scoring            = { type = "msac", threshold = 1.0 }   # px — the Sampson distance to the ellipse (≈ the geometric one); the circle's convention
# The circle's robustified LM (Triggs{WelschShape}). 2.5: owner-decided (2026-10-29), the
# stack's operating multiple of a consensus-anchored LM width
# (LocalOptimizationDoneRight's poselib_adapt).
local_optimization_strategy = { type = "triggs", loss = "welsch", efficiency_constant = 2.5 }

[pipelines.absolute_pose]
scoring            = { type = "msac", threshold = 8.0 }   # px — a convention (OpenCV solvePnPRansac's reprojectionError), not a tuned value
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.bearing_pose]
# refine_absolute_pose on caller-supplied bearings (a BearingPoseProblem; refine
# only — no find_*). The MSAC threshold is UNIT-FREE here: a fraction of the residual's
# bound, π (the largest angle between two rays) times the largest pixel
# whitening gain, so the default 1.0 admits every correspondence to the
# consensus set. With Irls{GaussianShape} the default local optimization is least squares
# over every correspondence at the caller's weights — the form's behaviour
# since it was hoisted from RadiometricCamera (2026-10-27). A caller's
# `scoring` is in the residual's unit (radians, or pixels with an `M` column).
scoring            = { type = "msac", threshold = 1.0 }   # × π·max‖(BᵀM)⁻¹‖ (dimensionless)
local_optimization_strategy = { type = "irls", loss = "gaussian" }

[pipelines.radial_homography]
scoring            = { type = "msac", threshold = 3.0 }   # px — a convention (the homography class's), not a tuned value
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.radial_camera]
# The 1-D radial camera of a board (distortion-free verification): the residual
# is the pixel distance to the predicted radial line (codimension 1).
scoring            = { type = "msac", threshold = 3.0 }   # px — a convention (the homography class's), not a tuned value
local_optimization_strategy = { type = "irls", loss = "tls" }

[pipelines.hand_eye]
# The MSAC threshold is UNIT-FREE here: a fraction of the problem's characteristic
# length L (median rig translation per motion), so find_hand_eye's default
# MSAC threshold of 0.01·L is the same whether the poses are in metres or
# millimetres (a rotation error of 0.01 rad ≈ 0.57° reaches it). A caller's
# `scoring` is a length (the poses' unit; metres for physical poses). A convention of this
# package (no external one exists), not a tuned value.
scoring            = { type = "msac", threshold = 0.01 }   # × L (dimensionless; rotation enters the residual as L·θ)
motion_pairs       = "consecutive"
local_optimization_strategy = { type = "irls", loss = "tls" }

# -----------------------------------------------------------------------------
# Per-class defaults of the refine_* entry points (the refine contract): the
# strategy a refine runs from the caller's model — no scorer, no consensus set.
# Triggs{Welsch}, ONE robustified chart LM, is the stack's default (owner,
# 2026-11-11; Huber where a fit has chosen it for accuracy). It has no width of
# its own here: its loss width is efficiency_constant(Welsch, codimension) times
# the caller's `scale` (or the caller's `width`) — a scale is data, never a
# default of this file. A class's ruling is an edit of its line.
# -----------------------------------------------------------------------------
[refine.homography]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.fundmat]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.essential]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.rotation]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.circle]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.ellipse]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.absolute_pose]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.bearing_pose]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.radial_homography]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.radial_camera]
optimization_strategy = { type = "triggs", loss = "welsch" }

[refine.hand_eye]
optimization_strategy = { type = "triggs", loss = "welsch" }

[fit_division_camera]
ncoef = 1
# The E-step, the fit's `weighting` (a fit takes no `scoring`): the shared Student-t + uniform
# scorer's posterior (`scoring_from_toml`, problem DivisionCameraProblem). Its outlier_halfwidth
# (px) is the uniform outlier half-width, NOT the residual scale.
weighting  = { type = "student_t_uniform", outlier_halfwidth = 20.0, scale_prior = "jeffreys", label_prior = "flat" }
# The loop: the shared posterior-weight iteration (`mixture_em_from_toml`) — the stack refitted
# each iteration, at most 30 of them (the branch audit included), stopped on the relative change of
# (f, k) and returning the LAST iterate: every iteration re-whitens at the previous solution, so no
# cost is comparable between iterations. The inlier prior is held at 1/2.
mixture_em = { max_iter = 30, model_update = { type = "weighted_refine" }, stop = { type = "parameter_change", rtol = 1.0e-9 }, nuisance = { scale = "estimated", nu = "estimated", inlier_prior = { type = "fixed_prior", inlier_prior = 0.5 } } }
# The branch audit's trimmed depth refits (`_branch_residual`): each trim keeps
# the rows inside a TLS loss at this multiple × σ̂, σ̂ the noise scale of the
# lift's residual norms (codimension 2). 3·√quantile(Chisq(2), 0.5): three medians.
branch_audit_efficiency_constant = 3.5322300675464233
# The E-step's start: the posterior seeded at the median residual (VisualGeometryToolkitCore's
# `median_seeded_posterior`) at this Student-t ν, the ν update's upper bound (VisualGeometryToolkitCore's
# `next_nu` ν_max): a near-Gaussian start, which the EM's estimated ν then moves.
seed_nu = 1.0e4

[robot_world_hand_eye]
min_rel_angle_deg = 5.0          # relative motions below this are degenerate for the init
# The robust fit's (optimization_strategy = Irls{K}): converged when an
# iteration moves every transform by less than `tol` in the whitened units
# (rotation / σ_rot, translation / σ_trans).
tol = 1.0e-10

[refine_robot_world_hand_eye]
# The strategy, as every refine_*'s (the refine contract): its loss width is
# efficiency_constant(Welsch, 2) times the caller's `scale` (pixels), or `width`.
optimization_strategy = { type = "triggs", loss = "welsch" }
# Its LM is the camera-and-poses bundle's one solve, at [refine_camera_and_poses]'s
# settings (max_iter, ftol, xtol): no settings of its own.

[refine_camera_and_poses]
# The strategy, as every refine_*'s (the refine contract): its loss width is
# efficiency_constant(Welsch, 2) times the caller's `scale` (pixels), or `width`.
optimization_strategy = { type = "triggs", loss = "welsch" }
max_iter = 100                   # the camera + poses LM's cap on ACCEPTED iterations (NLLSsolver's count; see Core's [lm])
# NLLSsolver's relative cost decrease and step tolerance (chart units), and the
# stall postcondition's exact-fit test (F < ftol, px²): the values the
# experiments' camera + poses bundle ran with (RadiometricCamera, until 2026-10-28).
ftol = 1.0e-12
xtol = 1.0e-12
[fit_rotation]
# The reweighted Kabsch of `fit_rotation`: an Irls strategy (loss, max_iter —
# the reweight-and-solve iterations at most), read by the one strategy reader.
# The loss runs at ONE width, `efficiency_constant × scale` (the shape's
# constant at codimension 2 unless the strategy gives one) or the call's
# `width`: the scale is data, never a TOML default.
optimization_strategy = { type = "irls", loss = "huber", max_iter = 50 }
tol                = 1.0e-12     # rad: converged when an iteration moves the rotation by less
[fit_rotation_averaging]
# The Lie-algebra IRLS of `fit_rotation_averaging` (Chatterjee & Govindu): an
# Irls strategy at ONE width, `efficiency_constant × scale` (the shape's
# constant at codimension 3 unless the strategy gives one) or the call's
# `width`. Read by the one strategy reader.
optimization_strategy = { type = "irls", loss = "huber", max_iter = 100 }
max_iter           = 100         # the least-squares fit's iterations at most (optimization_strategy = nothing: unit weights)
tol                = 1.0e-12     # rad: converged when an iteration moves every frame by less
[fit_linear]
# The reweighted least squares of `fit_linear`: an Irls strategy at ONE width,
# `efficiency_constant × scale` (the shape's constant at codimension 1 unless
# the strategy gives one) or the call's `width`. Read by the one strategy reader.
optimization_strategy = { type = "irls", loss = "huber", max_iter = 50 }
tol                = 1.0e-12     # converged when an iteration moves x by less (max-norm, relative to max(1, ‖x‖∞))
[fit_rigid_alignment]
# The reweighted Kabsch of `fit_rigid_alignment` (the ATE alignment). Its
# default is the classical least-squares alignment (optimization_strategy =
# nothing, in code); a robust call gives an Irls strategy and its scale.
tol                = 1.0e-12     # rad, and × the loss width: converged when an iteration moves the transform by less
[pipelines.radial_homography.lift_seed]
# The plain-homography seed of the radial homography's lifted local optimization
# (LocalOptimizationDoneRight's HQ/GNC, `lift_init`): k is seeded on the
# correspondences inside a TLS loss at `efficiency_constant` × σ̂, σ̂ the noise scale
# of the plain-H reprojection norms (codimension 2). 3·√quantile(Chisq(2), 0.5): three
# medians of the norms.
efficiency_constant = 3.5322300675464233
# The chart LMs' stop settings (the LO refits, a refine's least squares and Triggs, `refine_camera`'s lens families)
# and every bundle's stall tolerance are Core's one owner, `LmStops` (VisualGeometryToolkitCore configs/default.toml
# `[lm]`: max_iter 1000, ftol 1e-10, xtol 1e-10, stationarity_tol 0.05, with their measurements); Estimation's
# `[chart_lm]` table, equal to it, retired in 0.11.0. A fit overrides a field only from its own table below.

[relpose_bundle]
# the relative-pose bundle's LM cap (its `refine!` and `refine_relative_pose`) on
# ACCEPTED iterations: NLLSsolver's count, each one possibly hiding ~8–10 rejected
# candidate steps; see Core's [lm]
max_iter = 100
# Its relative cost tolerance (NLLSsolver's `reldcost`, as Core's [lm]). At the
# cost's rounding floor the reduction is rounding noise of 1e-15–5e-14
# relative (0.5 px residuals of ~600 px coordinates), and NLLSsolver accepts a
# step whose cost does not rise, so below the floor every iteration is a full
# linearization that buys nothing: measured 2026-10-27 on the A/B scenes
# (800 px, σ = 0.5 px, N = 100 / 1000 / 10000), at NLLSsolver's default
# (1e-15) and at eps the bundle takes 8 / 8 / 7 iterations, at 1e-10 it stops
# in 5 (60% fewer linearizations and Schur solves), the cost within 2.3e-14
# relative and the rotation within 1e-9 of the longer runs.
ftol = 1.0e-10

[refine_camera]
# a lens family's refine (`refine_camera(guess, source, region)`, and
# `approximate_camera`'s, `optical_axis`'s): the LM cap on
# ACCEPTED iterations (NLLSsolver's count, each possibly hiding ~8–10 rejected
# candidate steps; see Core's [lm])
max_iter = 100

[optical_axis]
# The radial terms of the axis family (`optical_axis`: Fisheye624's form, Equidistant ∘ Radial{Even, n}, its
# decentering held at zero; the radius θ·(1 + k₁θ² + … + kₙθ²ⁿ), terms θ³ … θ^(2n+1)). 4 (θ³…θ⁹), from the order
# study of 2026-11-13 (~/logs/dgx-agent/wave10/optical-axis-order.md; n = 2, 3, 4, 6 on the test fixtures and RC's
# spline-start cameras): the smallest n whose principal point lies within ½σ (its formal LS 1σ) of n = 6's on every
# converging RC camera, its cond(J) 47–160× below n = 6's and 1–4 iterations fewer. n = 2 is 7σ off (RC's
# radiometric_refinement start); n = 3 up to 1.2σ. Until 0.11.0 the family was Fisheye624's own, n = 6 (θ³…θ¹³).
radial_terms = 4

# SIMFIT++ (`SimFitPP`, Edstedt 2025): the reference implementation's constructor
# defaults (github.com/Parskatt/simfitpp).
[simfitpp]
alpha          = 0.99            # the inlier coverage the loss width targets: loss_width² = ppf_{χ²_dg}(alpha)·σ²
max_iter       = 4               # train/validation rounds at most
ftol           = 0.01            # stop when an accepted proposal moves the loss width by less (absolute, residual unit)
train_fraction = 0.5             # the share of the correspondences the geometry is fitted on
min_loss_width = 0.25            # px (the residual unit; `with_residual_unit` rescales): smallest acceptable loss width
max_loss_width = 8.0             # px: largest acceptable loss width
dg             = 1               # the residual codimension (χ² degrees of freedom): the reference's scalar Sampson residual

# The EM of the Student-t + uniform mixture (`MixtureEmConfig`): what an
# iteration does to the model, and to each part of the noise model. Under
# `fit_residual_mixture` the model is a held fit's, so the update is "keep_model";
# its `tol` stops the EM once an iteration lowers the mixture NLL by no more
# than that fraction. Every nuisance part is estimated: ŝ², ν and the inlier
# prior π (a held part is `{ type = "fixed_s2", s2 = … }`,
# `{ type = "fixed_prior", inlier_prior = … }` or `{ type = "fixed_nu", nu = … }`;
# ν may also be "consensus_dof", held at the consensus seed's posterior-
# predictive dof).
[mixture_em]
max_iter = 200
model_update = { type = "keep_model", tol = 1.0e-10 }
# the stop rule: "no_improvement" (the incumbent's cost — under keep_model its NLL at `tol` —
# returning the incumbent) or { type = "parameter_change", rtol = … } (the relative change of the
# parameters, returning the last iterate)
stop = "no_improvement"
nuisance = { scale = "estimated", inlier_prior = "estimated", nu = "estimated" }

# -----------------------------------------------------------------------------
# Scorer internals: the stack's defaults of a scorer table's keys (`scoring_from_toml`), as
# [optimization_strategy.<type>] holds a strategy's. A key a scorer table leaves out inherits its value here.
# A scorer's width (`threshold`, `outlier_halfwidth`) is deliberately absent: it is its config's.
# -----------------------------------------------------------------------------
[scoring.student_t_uniform]
# The Student-t + uniform marginal scorer's priors, required keys of its table (the owner's ruling (c),
# 2026-11-11): the scale σ² integrated out against Jeffreys' π(σ²) ∝ 1/σ² ("ig" takes alpha0 and beta0),
# the inlier probability fixed at γ = ½ ("profiled"; "beta" takes alpha and beta) — the paper's
# profile-marginal score, the scorer's configuration of record.
scale_prior = "jeffreys"
label_prior = "flat"

# -----------------------------------------------------------------------------
# This package's optimization strategies' keyword defaults, one table per tag
# (none has a default today: TerminalLO's `inner` is required). The core
# strategies' (Irls, Triggs) are VisualGeometryToolkitCore's configs/default.toml.
# -----------------------------------------------------------------------------
[optimization_strategy]
