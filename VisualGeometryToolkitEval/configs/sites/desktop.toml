# desktop: the owner's workstation (pop-os). One RTX 4090, no Slurm: every stage runs here in order. A GPU stage sees
# device 0 only (CUDA_VISIBLE_DEVICES=0, never another device). The launchers' default thread count is kept, so the
# runs are keyed as on a Slurm site. Keys: _template.toml.
#
# Storage: one tree under the home's data directory, ~/data/vgtk (the home read by the runner: `~` and `$HOME` are
# spelled out in a site profile's [storage] paths, and nowhere else), beside the data already there
# (~/data/datasets, ~/data/models, …, which stay where they are): every project's inputs under data/<project>, its
# results under results/<project>, and the artifact store, shared by every project and package, under artifacts/. A
# project's own [sites.desktop] roots (its checkout's data/exp_raw, data/exp_pro) are read before these, and a data
# or results root here is used only once it exists.
[site]
name = "desktop"
backend = "local"
description = "pop-os: one RTX 4090, no scheduler"

[local]
cuda_visible_devices = "0"

[storage]
data_root = "~/data/vgtk/data/{project}"
results_root = "~/data/vgtk/results/{project}"
artifact_store = "~/data/vgtk/artifacts"
