# dgx01: the server. One Slurm node, 224 CPUs, 1900 GB, 8 × NVIDIA B200, partition `gpu`. Every stage is an sbatch
# job; one GPU per array task; 2 CPUs per task unless the stage declares its own `cpus_per_task` (a task gets the CPUs
# it uses: most use one or two, and the count keys no run), at the node's memory ratio, 8480M per CPU (1900 GB / 224
# CPUs, the node rule). Keys: _template.toml.
[site]
name = "dgx01"
backend = "slurm"
description = "dgx01: one Slurm node, 224 CPUs, 1900 GB, 8 × B200, partition gpu"

[slurm]
partition = "gpu"
gres = "gpu:1"
cpus_per_task = 2
mem_per_cpu = "8480M"
precompile_time = "0:30:00"    # a GPU stage's CPU precompile job: measured ≈ 12–15 min at 6 CPUs (the wave-10 gate preps), × 2
gpu_limit = 0
