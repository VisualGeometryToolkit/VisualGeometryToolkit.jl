# dgx01: the server. One Slurm node, 224 CPUs, 1900 GB, 8 × NVIDIA B200, partition `gpu`. Every stage is an sbatch
# job; one GPU per array task; 28 CPUs per task (the thread count the runs of record were keyed with) at the node's
# memory ratio (1900 GB / 224 CPUs ≈ 8.5 GB per CPU). Keys: _template.toml.
[site]
name = "dgx01"
backend = "slurm"
description = "dgx01: one Slurm node, 224 CPUs, 1900 GB, 8 × B200, partition gpu"

[slurm]
partition = "gpu"
gres = "gpu:1"
cpus_per_task = 28
mem_per_cpu = "8G"
gpu_limit = 0
