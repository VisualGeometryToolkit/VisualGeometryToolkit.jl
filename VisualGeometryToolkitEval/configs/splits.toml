    "brandenburg_gate", "british_museum", "buckingham_palace",
    "colosseum_exterior", "florence_cathedral_side", "grand_place_brussels",
    "lincoln_memorial_statue", "milan_cathedral", "mount_rushmore",
    "trevi_fountain",
]
test_scenes = [
    "notre_dame_front_facade", "palace_of_westminster", "pantheon_exterior",
