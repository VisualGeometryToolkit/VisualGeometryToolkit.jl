# ETH3D high-res: a 6/7 split of the 13 scenes, drawn once at random with
# seed 42 (the lists ARE the split).
[splits.eth3d]
validation_scenes = ["courtyard", "delivery_area", "electro", "facade", "kicker", "meadow"]
test_scenes = ["office", "pipes", "playground", "relief", "relief_2", "terrace", "terrains"]

# HEB (the homography benchmark, HEB-H-SIFT pools): the alphabetical halves of
# the 10 scenes.
[splits.heb]
validation_scenes = ["Alamo", "Ellis_Island", "Madrid_Metropolis", "NYC_Library", "Piazza_del_Popolo"]
test_scenes = ["Roman_Forum", "Tower_of_London", "Union_Square", "Vienna_Cathedral", "Yorkminster"]

# A 2+2 SUBSET of [splits.heb], for a cheap end-to-end rehearsal — NOT a result.
# The scenes are the two smallest pools of each side (NYC_Library 9.3 GB, Alamo
# 10.0; Vienna_Cathedral 9.0, Union_Square 9.8), because a rehearsal's cost is
# dominated by I/O and not by the pair sampling: a pool is deserialized in FULL
# and then subsampled, so a 5 % sample of five scenes still reads ~50 GB and
# spends ~30 min before any tuning starts (measured, HEB-H job 6693). Halving
# the scenes is the only lever that moves it.
#
# It is a registered split because a config may not name scenes itself — the
# registry owns every scene list in the stack (`_registered` refuses a config
# whose lists differ from the registry's), and a rehearsal is not an exception
# to that.
[splits.heb_smoke]
validation_scenes = ["Alamo", "NYC_Library"]
test_scenes = ["Union_Square", "Vienna_Cathedral"]

# 7-Scenes: the 18 test sequences of the SuperANSAC protocol, split 9/9 at SEQUENCE granularity (`<scene>__seq-NN`): the
# validation half drawn once at random with seed 42, the test half its
# complement. Two-view pools name their scenes by sequence; the absolute-pose
# pools hold whole scenes, their queries named `<scene>__seq-NN__…`.
[splits.seven_scenes]
validation_scenes = [
    "chess__seq-03", "chess__seq-05", "fire__seq-03", "office__seq-02",
    "pumpkin__seq-07", "redkitchen__seq-03", "redkitchen__seq-04",
    "redkitchen__seq-14", "stairs__seq-04",
]
test_scenes = [
    "fire__seq-04", "heads__seq-01", "office__seq-06", "office__seq-07",
    "office__seq-09", "pumpkin__seq-01", "redkitchen__seq-06",
    "redkitchen__seq-12", "stairs__seq-01",
]

# BlobBoards (bmvc2026 tune_invariance.jl): the detector/estimator thresholds
# are tuned on a SEPARATE capture session, 260521 (a different day and
# aperture), and the paper reports the 260527 sweep. A scene is a capture
# session's image subset, `<session>/<subset>`; a unit is one frame.
[splits.blobboards_cross_session]
validation_scenes = ["260521/bb"]
test_scenes = ["260527/bb"]

# BlobBoards' radial-camera tuning: the radial-camera widths are tuned on the
# calibration subset of the 260527 session — the frames the camera is
# estimated from — and the poses are scored on its `bb` subset.
[splits.blobboards_260527_subsets]
validation_scenes = ["260527/calibration_bb"]
test_scenes = ["260527/bb"]
