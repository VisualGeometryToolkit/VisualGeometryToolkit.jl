# =============================================================================
# configs/splits.toml — THE scene splits of record of the evaluation stack:
# every validation (tuning) and test (reporting) scene list, in ONE file.
#
# A tuning spec names a split (`[tuning.<name>.cross_validation] scene_split =
# { type = "registered", name = "<split>" }`, VisualGeometryToolkitEval
# docs/src/tuning.md); the parser fills in the lists from here, so the complete
# spec — and with it the spec hash and every tuning artifact — carries the
# exact lists a run used. No paper, driver or package states a scene list in
# code. Each split's lists are nonempty and DISJOINT (refused otherwise); the
# order within a list does not matter (lists are kept sorted).
#
# Parsed at precompile (`include_dependency`): an edit forces a recompile, so a
# Revise session needs a restart to see one. Changing a list changes
# every spec hash that names the split — the runs under it regenerate.
# =============================================================================

# PhotoTourism (IMC 2020): the alphabetical 10/11 partition of the 21 scenes
# every all-pairs production run used (reconciled 2026-07-09; it replaced the
# Shekhovtsov-aligned split).
