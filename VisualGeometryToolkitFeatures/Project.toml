# CUDA_Runtime_jll and CUDNN_jll are never loaded and have no extension: ONNX Runtime's CUDA provider takes the CUDA 12
# builds of their (lazy) artifacts, located by UUID in the active environment and dlopened by path (src/onnx_runtime.jl;
# loading CUDNN_jll would open the host CUDA's build under the same soname). Weak, so [compat] pins them where an
# environment holds them, and an environment without them never resolves or downloads them.
[weakdeps]
CUDA_Runtime_jll = "76a88914-d11a-5bdc-97e0-2f5a05c973a2"
CUDNN_jll = "62b44479-cb7b-5706-934f-f13b2eb2e645"
