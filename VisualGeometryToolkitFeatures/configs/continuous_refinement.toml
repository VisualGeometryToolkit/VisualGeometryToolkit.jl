# =============================================================================
# The continuous DoG-extremum refinement (src/asift/continuous_refine.jl) — research
# path, OFF by default: `asift_detect` does not call it. Every bound and tolerance of
# the refinement is read from here (Core's parse_defaults/toml_default); there is no
# second set of Julia literals.
#
# Units. `v = (x, y, s)` are a detection's octave-level coordinates (level pixels, and
# the DoG slice index). The LM iterates on the scale-normalised displacement
# θ = (Δx/σ, Δy/σ, Δℓ), σ the detection's scale in level pixels at the start and
# ℓ = ln σ (Δℓ = Δs·ln2/S): Gaussian scale space is invariant under (x, σ) ↦ (λx, λσ),
# so a unit step in x/σ and a unit step in ln σ move the response comparably.
# =============================================================================

[continuous_refinement]
# The response (ContinuousRefinement's one recipe, the owner's position-first choice of 2026-11-13): the
# spatial gradient from the Farid–Simoncelli matched first-derivative fields of [farid_simoncelli_5tap], the
# scale row from the unfiltered slices. Measured on noise-free blobs (benchmark/continuous_refine, 3388
# refinements, o = −1…3): max position bias 0.0001–0.0005 level px (today's 0.02–0.14, the plain spline's
# 0.002–0.007), the plain spline's scale error (≤ 0.0041 in ln σ at octaves 1–3) and NEES₂ 1.94–2.09. A
# prefiltered scale row is biased by ½ ln(1 + β²/σ²), 0.03–0.12 in ln σ (β² = Σ j²·p[j] = 0.742 level px²), which
# is why the scale row is the unfiltered one.

# Half-width K of the truncated cardinal cubic-spline prefilter h[k] = √3·z₁^|k|,
# z₁ = √3 − 2 (the inverse of the sampled cubic B-spline [1, 4, 1]/6; Unser 1999).
# The dropped tail is Σ_{|k|>K} |h[k]| = 2√3·|z₁|^(K+1)/(1 − |z₁|) = 2.6e-6 at K = 10
# (3.5e-5 at K = 8) of a unit sample: below the spline's own approximation error on
# the pyramid (measured, benchmark/continuous_refine Table 3: its gradient error is 1.9e-3 of |D| at
# octaves 1–3, 7e-3 at octave 0). The taps are
# renormalised to sum to 1, so a constant is reproduced exactly.
prefilter_halfwidth = 10

# The displacement box from the start (today's refined detection), per axis: |Δx|, |Δy|
# ≤ spatial_bound level px and |Δs| ≤ scale_bound slices. Two distinct 26-neighbour
# extrema are at least 2 samples apart on some axis, so a box of half-width 1 can
# hold the refined point of at most the start's own extremum; the disagreement it
# must admit is today's refinement error, at most 0.19 level px between the
# finals of two starts and 0.1 level px of phase bias (featcov-diagnosis.md,
# Tables F1/F3). The box is the LM's bounds (a step is clipped to it); a solve that
# ends on it unconverged is `LeftBasin`.
spatial_bound = 1.0
scale_bound = 1.0

# The near-singular curvature gate: the smallest eigenvalue of −sign(D)·H_θ/|D|
# (the Hessian in θ, relative to the response) must be at least this. On a clean
# Gaussian blob the eigenvalues are O(1) (the spatial ones σ²/(σ_b² + σ²) ≈ 0.5 by the
# analytic scale space; not tabulated by the benchmark, where no ShapeGate fired in 3388
# refinements, 2026-11-12); today's edge test keeps
# spatial ratios ≤ edge_thr = 10, i.e. the smaller spatial eigenvalue ≥ 0.05. A floor
# of 1e-3 is fifty times below that: it rejects only a curvature whose inverse would
# amplify the response's own interpolation error (≤ 1e-4 relative) past 0.1 level px.
min_curvature = 1.0e-3

# Core's device LM (`static_lm`) on the rows r(θ) = ∇_θ D/|D(start)| with Jacobian ∇²_θ D/|D(start)|: an
# undamped step is Newton's, the Marquardt damping and the box safeguard it. Its stop settings are Core's, the
# stack's one owner (`StaticLmStops`, configs/default.toml `[lm]`): no key here (`max_iter`, `converged_tol2` and
# `cost_floor` are retired). Success is Core's one rule: the point is stationary.

# CPU = GPU (the test's tolerance on the refined point, per coordinate in level units — level px and slices):
# the two backends contract the Float32 coefficient sums differently (NVPTX fuses a multiply-add, the host
# does not), so each solves for the root of a model perturbed by δg ≲ √n·eps(Float32)·Σ|w| relative to |D|:
# n = 441 products of a 21 × 21 prefilter whose |taps| sum to 1.73² ≈ 3, so δg ≲ 21 · 6e-8 · 3 = 3.8e-6.
# The root moves by δθ ≤ δg / λ_min with λ_min ≥ 0.05 (the edge test's bound on the θ-curvature): 7.6e-5,
# and each solve stops at its own root to Core's step tolerance (1e-10 relative): δθ ≤ 8e-5 in all. In level
# units that is ×σ ≤ 3.6 spatially and ×S/ln2 = 4.3 in the slice: 3.5e-4.
cpu_gpu_tolerance = 3.5e-4

# The Farid–Simoncelli matched prefilter and first-derivative filter ("Differentiation of discrete
# multi-dimensional signals", IEEE TIP 13(4), 2004, Table I: the 5-tap set designed jointly for the first and
# second derivative; the second-derivative filter is not used). Taps listed from sample −2 to +2 as CORRELATION weights (value = Σⱼ w[j]·f[n + j]): the
# paper's convolution filters reversed — p is symmetric, d1's sign flips (its Table I half, sample 0 … 2,
# is 0, −0.292315, −0.104550 as a convolution). Σ j·d1[j] = 1.0028: matched in the frequency band the design
# weights, not moment-exact.
[farid_simoncelli_5tap]
prefilter = [0.030320, 0.249724, 0.439911, 0.249724, 0.030320]
first_derivative = [-0.104550, -0.292315, 0.000000, 0.292315, 0.104550]
