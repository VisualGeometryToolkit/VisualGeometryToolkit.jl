# The validation scripts (mser_vlfeat.jl). Deliberately NOT a workspace member,
# like examples/: it resolves on its own, in its own (untracked) Manifest, so
# the image loaders and BenchmarkTools stay out of the package and its tests.
#   julia --project=VisualGeometryToolkitFeatures/validation -e 'using Pkg; Pkg.instantiate()'
[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
FileIO = "5789e2e9-d7fb-5bc7-8068-2c6fae9b9549"
ImageCore = "a09fc81d-aa75-5fe9-8630-4744c3626534"
ImageIO = "82e4d734-157c-48bb-816b-45c225c6df19"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
VisualGeometryToolkitCore = "96820d6b-1dad-4e77-ad4a-8276f2ec1ce7"
VisualGeometryToolkitFeatures = "9487290e-790c-4faa-aa87-bc3b5f18b9f7"

[sources]
VisualGeometryToolkitCore = {path = "../../VisualGeometryToolkitCore"}
VisualGeometryToolkitFeatures = {path = ".."}

[compat]
BenchmarkTools = "1.6"
FileIO = "1"
ImageCore = "0.10"
ImageIO = "0.6"
Printf = "1"
TOML = "1"
VisualGeometryToolkitCore = "0.2"
VisualGeometryToolkitFeatures = "0.2"
julia = "1.12"
