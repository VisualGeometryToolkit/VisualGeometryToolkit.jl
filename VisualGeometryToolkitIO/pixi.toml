[workspace]
name = "VisualGeometryToolkitIO"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]

# pycolmap is the reference implementation the COLMAP wire layer is verified
# against (test/pycolmap_tests.jl, skipped when this environment is absent);
# pycolmap and opencv-python generate the frozen lens-convention oracles
# (test/oracles/generate.py → test/oracles/lens_conventions.json).
# jsonschema validates every fixture and every deletion case against the
# published JSON Schemas (test/json_schema_tests.jl, test/python/); the
# content-identity check (test/python/content_id.py) is the standard library's.
[feature.py.dependencies]
python = ">=3.11,<3.14"

[feature.py.pypi-dependencies]
pycolmap = "*"
opencv-python-headless = "*"
numpy = "*"
jsonschema = ">=4.18"

[environments]
py = { features = ["py"] }
